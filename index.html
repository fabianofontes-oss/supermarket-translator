<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <!--
      REDE DE SEGURANÇA DO BOOT

      Isto existe porque o app já ficou com tela branca num celular, e o motivo
      era estrutural: TODA a recuperação que o projeto construiu — o
      `chunkRecovery`, o `pwaUpdate`, a `ErrorBoundary`, a folha de atualização
      — mora DENTRO do bundle. Quando é o próprio bundle que não carrega, nada
      disso roda. O socorro estava trancado do lado de dentro.

      O cenário real: um deploy novo entra e apaga os arquivos com hash antigo.
      Um service worker de uma versão anterior continua servindo o `index.html`
      dela, que aponta para um `.js` que agora dá 404. O navegador pede, não
      recebe, e a página fica em branco para sempre — não há segunda tentativa,
      porque quem tentaria de novo era o código que não chegou.

      Este script é inline de propósito: ele precisa sobreviver exatamente à
      falha que vai consertar. Se `#root` continuar vazio, ele desregistra os
      service workers, limpa os caches e recarrega.

      Três travas, todas necessárias:

      - UMA VEZ POR ABA, em `sessionStorage`, pela mesma razão que o
        `chunkRecovery` se limita a uma recarga: se a causa não for cache, um
        laço de recarga é pior que a tela branca.
      - SÓ ONLINE. O app é offline-first. Offline, esse cache pode ser a única
        cópia que existe, e limpá-lo trocaria uma tela branca temporária por um
        app destruído.
      - SÓ COM `#root` VAZIO. App montado não se mexe, aconteça o que acontecer.
    -->
    <script>
      (function () {
        var CHAVE = 'th_boot_recuperado';

        function montou() {
          var raiz = document.getElementById('root');
          return !!(raiz && raiz.childElementCount > 0);
        }

        // Sem `sessionStorage` não há como garantir "uma vez só", e aí é mais
        // seguro não fazer nada do que arriscar o laço.
        function reservarTentativa() {
          try {
            if (sessionStorage.getItem(CHAVE) === '1') return false;
            sessionStorage.setItem(CHAVE, '1');
            return sessionStorage.getItem(CHAVE) === '1';
          } catch (e) {
            return false;
          }
        }

        // `limpar` só é verdadeiro no caminho em que apagar o cache RESOLVE:
        // o bundle deu 404 porque o HTML em cache aponta para um arquivo que
        // não existe mais. Ver `porTempo` abaixo para o outro caminho.
        function recuperar(limpar) {
          if (montou()) return;
          if (navigator.onLine === false) return;
          if (!reservarTentativa()) return;

          if (!limpar) { window.location.reload(); return; }

          var tarefas = [];
          try {
            if (navigator.serviceWorker) {
              tarefas.push(
                navigator.serviceWorker.getRegistrations().then(function (regs) {
                  return Promise.all(regs.map(function (r) { return r.unregister(); }));
                })
              );
            }
          } catch (e) { /* navegador sem service worker: nada a desregistrar */ }
          try {
            if (window.caches) {
              tarefas.push(
                caches.keys().then(function (nomes) {
                  return Promise.all(nomes.map(function (n) { return caches.delete(n); }));
                })
              );
            }
          } catch (e) { /* sem Cache Storage: nada a limpar */ }

          var recarregar = function () { window.location.reload(); };
          Promise.all(tarefas).then(recarregar, recarregar);
        }

        // O 404 do bundle dispara `error` no próprio <script>, e isso chega
        // bem antes do relógio. Na fase de captura porque erro de recurso não
        // borbulha.
        window.addEventListener('error', function (evento) {
          var alvo = evento.target;
          if (alvo && alvo !== window && alvo.tagName === 'SCRIPT') recuperar(true);
        }, true);

        // Cinto e suspensório, para o script CHEGAR e morrer antes de montar.
        // Aqui NÃO se apaga cache: apagar só resolve quando o arquivo não
        // existe, e nesse caso o `error` acima já tratou. Numa primeira carga
        // em 3G ruim — que é a rede de quem usa este app — passar de 8s é
        // normal, e limpar o cache de quem só estava esperando trocaria uma
        // demora por um app sem nada offline. 20s, e só recarrega.
        setTimeout(function () { recuperar(false); }, 20000);
      })();
    </script>

    <!-- Sem `maximum-scale`/`user-scalable`: bloquear zoom falha o critério
         1.4.4 da WCAG, e o público inclui gente lendo bula numa farmácia. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- O áudio com o sotaque certo depende disto.
         O endpoint de voz do Google recusa a requisição quando o navegador
         manda `Referer` — devolve HTML no lugar do MP3, e o `<audio>` falha com
         MEDIA_ERR_SRC_NOT_SUPPORTED. Sem `Referer` ele responde 200 audio/mpeg.
         Medido nos dois sentidos; não é suposição.
         O app não faz nenhuma outra requisição externa, então não há o que
         perder ao omitir o cabeçalho. -->
    <meta name="referrer" content="no-referrer" />

    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Aquí se dice" />
    <!-- A cor da barra do navegador. Sem `media`, vale para qualquer tema do
         sistema, que é o que queremos: o app é claro em qualquer aparelho. -->
    <meta name="theme-color" content="#c83745" />
    <meta name="description" content="Frases prontas para quem mora fora: pedir caminho, dizer onde dói, hora e preço, trabalho em casa e com idosos. Você escolhe, o celular fala." />

    <!-- Open Graph. Sem estas tags o link compartilhado chega no WhatsApp como
         uma URL pelada, e o `sharer.php` do Facebook fica sem título, sem
         descrição e sem imagem — ele ignora texto pré-preenchido e lê só daqui.
         O `index.html` é servido estático pela Vercel, então o crawler vê estas
         tags mesmo com o app sendo renderizado no cliente.

         `og:image` tem que ser ABSOLUTA. Reaproveita o ícone que já está no
         precache em vez de somar um arquivo novo ao download de todo usuário por
         causa de algo que só o crawler lê. A URL aqui é a mesma `SHARE_URL` de
         `constants.ts`; HTML não importa constante, então são dois lugares. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Aquí se dice" />
    <meta property="og:description" content="Frases prontas para quem mora fora: pedir caminho, dizer onde dói, hora e preço, trabalho em casa e com idosos. Você escolhe, o celular fala." />
    <meta property="og:url" content="https://translator-zeta-weld.vercel.app" />
    <meta property="og:image" content="https://translator-zeta-weld.vercel.app/icons/pwa-512x512.png" />
    <meta property="og:locale" content="pt_BR" />
    <meta name="twitter:card" content="summary" />

    <!-- Texto inicial: `App.tsx` reescreve o título em tempo de execução, na
         língua de quem lê, junto com o `lang` do documento. -->
    <title>Aquí se dice</title>
  </head>
  <body>
    <div id="root"></div>


    <script type="module" src="/index.tsx"></script>
  </body>
</html>
