<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- Sem `maximum-scale`/`user-scalable`: bloquear zoom falha o critério
         1.4.4 da WCAG, e o público inclui gente lendo bula numa farmácia. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- O áudio com o sotaque certo depende disto.
         O endpoint de voz do Google recusa a requisição quando o navegador
         manda `Referer` — devolve HTML no lugar do MP3, e o `<audio>` falha com
         MEDIA_ERR_SRC_NOT_SUPPORTED. Sem `Referer` ele responde 200 audio/mpeg.
         Medido nos dois sentidos; não é suposição.
         O app não faz nenhuma outra requisição externa, então não há o que
         perder ao omitir o cabeçalho. -->
    <meta name="referrer" content="no-referrer" />

    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Translator Hub" />
    <meta name="theme-color" content="#c83745" />
    <meta name="description" content="Guia de sobrevivência para imigrantes: supermercado, farmácia, direções e mais, com o produto equivalente no país de destino." />

    <title>Translator Hub</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
